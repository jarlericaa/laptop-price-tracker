name: Weekly laptop price tracker

# Modes (decided in scripts/ci_plan.py, tested in tests/test_ci_workflow.py):
#   A. Manual preview     workflow_dispatch, publish = false (default): full pipeline and the
#                         publication preview; never writes to Google Sheets.
#   B. Manual production  workflow_dispatch, publish = true: the same, then publish and verify.
#                         existing_run_id publishes an already collected run without scraping.
#   C. Scheduled          Mondays 09:17 Asia/Manila, governed by the repository Variable
#                         WEEKLY_AUTOMATION: unset/off = skipped, preview = no write,
#                         publish = unattended production run.
# No pull_request or pull_request_target trigger exists, so untrusted code never sees credentials.
# Setup: docs/GITHUB_ACTIONS_SETUP.md

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to the production Google Sheet after validation (default: preview only)"
        type: boolean
        default: false
      existing_run_id:
        description: "Publish this already collected run (folder name such as 20261109T065857Z) without scraping again. Requires publish."
        type: string
        default: ""
      accept_retailer_failures:
        description: "I reviewed the diagnostics and accept a run that had retailer request failures"
        type: boolean
        default: false
  schedule:
    - cron: "17 9 * * 1"
      timezone: "Asia/Manila"

permissions:
  contents: read

# One run at a time for the whole workflow: previews, collections and publications share one
# state, and a running production job must never be cancelled half way.
concurrency:
  group: laptop-price-tracker-production
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.14"
  PYTHONUNBUFFERED: "1"
  SPREADSHEET_ID: ${{ vars.SPREADSHEET_ID }}
  GOOGLE_USE_ADC: "true"
  GCS_STATE_BUCKET: ${{ vars.GCS_STATE_BUCKET }}
  GCS_STATE_PREFIX: ${{ vars.GCS_STATE_PREFIX }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}

jobs:
  plan:
    name: Decide mode
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
      publish: ${{ steps.plan.outputs.publish }}
      collect: ${{ steps.plan.outputs.collect }}
      existing_run_id: ${{ steps.plan.outputs.existing_run_id }}
      accept_partial: ${{ steps.plan.outputs.accept_partial }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide the run mode
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_EXISTING_RUN_ID: ${{ inputs.existing_run_id }}
          INPUT_ACCEPT_RETAILER_FAILURES: ${{ inputs.accept_retailer_failures }}
          VAR_WEEKLY_AUTOMATION: ${{ vars.WEEKLY_AUTOMATION }}
        run: python3 scripts/ci_plan.py plan

  collect:
    name: Collect, validate and preview
    needs: plan
    if: needs.plan.outputs.skip != 'true' && needs.plan.outputs.collect == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write # Workload Identity Federation: a short-lived Google token, no stored key
    outputs:
      run_id: ${{ steps.locate.outputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check required Variables
        run: python scripts/ci_plan.py check --auth
      - name: Authenticate to Google (Workload Identity Federation)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Check Google Sheets access (read-only)
        run: python scripts/smoke_test.py
      - name: Take the state lock
        id: lock
        run: python scripts/ci_state.py lock --owner "gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --ttl-minutes 300
      - name: Restore the latest validated state
        id: restore
        run: python scripts/ci_state.py restore
      - name: Run the weekly pipeline (stops at the publication preview)
        id: driver
        continue-on-error: true
        run: bash scripts/run_variation_week.sh
      - name: Locate the run folder
        id: locate
        if: always()
        run: |
          run_dir="$(cat /tmp/current_weekly_run.txt 2>/dev/null || true)"
          echo "RUN_DIR=${run_dir}" >> "$GITHUB_ENV"
          echo "run_id=$(basename "${run_dir:-none}")" >> "$GITHUB_OUTPUT"
      - name: Validate readiness (machine-readable run metadata)
        id: gate
        if: steps.driver.outcome == 'success'
        continue-on-error: true
        env:
          ACCEPT_PARTIAL: ${{ needs.plan.outputs.accept_partial }}
          MAX_MATCHING_DROP_PCT: ${{ vars.MAX_MATCHING_DROP_PCT }}
        run: |
          args=()
          if [ "$ACCEPT_PARTIAL" = "true" ]; then args+=(--accept-retailer-failures); fi
          if [ -n "$MAX_MATCHING_DROP_PCT" ]; then args+=(--max-matching-drop-pct "$MAX_MATCHING_DROP_PCT"); fi
          python scripts/ci_run_gate.py --run-dir "$RUN_DIR" --output "$RUN_DIR/gate.json" \
            --title "Collection result" "${args[@]}"
      - name: Save validated state (versioned, append-only checked)
        id: save
        if: always() && steps.restore.outcome == 'success'
        run: |
          python scripts/ci_state.py save --run-id "$(basename "${RUN_DIR:-run-${GITHUB_RUN_ID}}")" \
            --note "github run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
      - name: Save the run bundle for publication
        id: bundle
        if: steps.driver.outcome == 'success'
        run: python scripts/ci_state.py bundle-save --run-dir "$RUN_DIR"
      - name: Upload sanitized diagnostics (no sales data, no databases)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/output/weekly_runs/*/status.json
            data/output/weekly_runs/*/stages.jsonl
            data/output/weekly_runs/*/driver.log
            data/output/weekly_runs/*/gate.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Release the state lock
        if: always() && steps.lock.outcome == 'success'
        run: python scripts/ci_state.py unlock --owner "gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Fail the job if any critical step failed
        if: always()
        env:
          DRIVER: ${{ steps.driver.outcome }}
          GATE: ${{ steps.gate.outcome }}
          SAVE: ${{ steps.save.outcome }}
          BUNDLE: ${{ steps.bundle.outcome }}
        run: |
          echo "pipeline=$DRIVER gate=$GATE state_save=$SAVE bundle=$BUNDLE"
          {
            echo "### Outcome"
            echo "- Pipeline: $DRIVER"
            echo "- Readiness gate: $GATE"
            echo "- State save: $SAVE"
            echo "- Run bundle: $BUNDLE"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$DRIVER" != "success" ] || [ "$GATE" != "success" ] || [ "$SAVE" != "success" ] || [ "$BUNDLE" != "success" ]; then
            echo "A critical step did not succeed." >&2
            exit 1
          fi

  publish:
    name: Publish to Google Sheets
    needs: [plan, collect]
    if: >-
      always() && needs.plan.outputs.skip != 'true' && needs.plan.outputs.publish == 'true' &&
      (needs.collect.result == 'success' ||
      (needs.plan.outputs.existing_run_id != '' && needs.collect.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production # add required reviewers here if you want a click before each publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check required Variables
        run: python scripts/ci_plan.py check --auth
      - name: Authenticate to Google (Workload Identity Federation)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Load the validated run bundle
        env:
          RUN_ID: ${{ needs.collect.outputs.run_id || needs.plan.outputs.existing_run_id }}
        run: |
          if ! printf '%s' "$RUN_ID" | grep -Eq '^[0-9]{8}T[0-9]{6}Z$'; then
            echo "Run ID '$RUN_ID' is not a run folder name (expected like 20261109T065857Z)." >&2
            exit 1
          fi
          mkdir -p data/output/weekly_runs
          python scripts/ci_state.py bundle-load --run-id "$RUN_ID" --dest "data/output/weekly_runs/$RUN_ID"
          echo "RUN_DIR=data/output/weekly_runs/$RUN_ID" >> "$GITHUB_ENV"
      - name: Gate, re-preview against the live workbook, publish once, verify
        env:
          ACCEPT_PARTIAL: ${{ needs.plan.outputs.accept_partial }}
          MAX_MATCHING_DROP_PCT: ${{ vars.MAX_MATCHING_DROP_PCT }}
        run: |
          args=()
          if [ "$ACCEPT_PARTIAL" = "true" ]; then args+=(--accept-retailer-failures); fi
          if [ -n "$MAX_MATCHING_DROP_PCT" ]; then args+=(--max-matching-drop-pct "$MAX_MATCHING_DROP_PCT"); fi
          python scripts/ci_publish.py --run-dir "$RUN_DIR" --write "${args[@]}"
